plugins {
    id 'java-library'
    id 'scala'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // api: on consumers' compile classpaths when they depend on :phobail
    api group: 'org.scala-lang', name: 'scala-library', version: rootProject.ext.scalaVersion
    implementation group: 'org.scala-lang', name: 'scala-compiler', version: rootProject.ext.scalaVersion
    api group: 'net.sf.supercsv', name: 'super-csv', version: rootProject.ext.superCsvVersion
    api group: 'org.slf4j', name: 'slf4j-api', version: rootProject.ext.slf4jVersion
    api group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: rootProject.ext.log4j2Version
    api group: 'org.apache.logging.log4j', name: 'log4j-api', version: rootProject.ext.log4j2Version
    api group: 'org.apache.logging.log4j', name: 'log4j-core', version: rootProject.ext.log4j2Version

    testImplementation group: 'org.scalatest', name: "scalatest_${rootProject.ext.scalaBinaryVersion}", version: rootProject.ext.scalaTestVersion
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: rootProject.ext.junitVersion
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: rootProject.ext.junitVersion
    testRuntimeOnly group: 'org.scalatestplus', name: "junit-5-14_${rootProject.ext.scalaBinaryVersion}", version: rootProject.ext.scalaTestPlusVersion
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}
